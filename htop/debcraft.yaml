name: htop
version: '3.5.3-1'
summary: Interactive process viewer
description: |
  Htop is an ncursed-based process viewer similar to top, but it
  allows one to scroll the list vertically and horizontally to see
  all processes and their full command lines.

  Tasks related to processes (killing, renicing) can be done without
  entering their PIDs.
base: ubuntu@24.04
maintainer: JJ Coldiron <jj.coldiron@canonical.com>
original-maintainer: Daniel Lange <DLange@debian.org>
section: utils

packages:
  htop:
    suggests:
      - lm-sensors
      - lsof
      - strace

parts:
  htop:
    plugin: autotools
    source: https://github.com/htop-dev/htop
    source-type: git
    source-tag: 3.5.3
    autotools-configure-parameters:
      - --prefix=/usr
      - --enable-sensors
    build-packages:
      - libncurses-dev
      - libsensors-dev
      - pkg-config
    override-build: |
      craftctl default
      strip --remove-section=.comment --remove-section=.note \
        $CRAFT_PART_INSTALL/usr/bin/htop
    organize:
      (build)/README.md: usr/share/doc/htop/
      (build)/NEWS: usr/share/doc/htop/
      (build)/ChangeLog: usr/share/doc/htop/changelog
      (build)/AUTHORS: usr/share/doc/htop/

  distro-files:
    plugin: dump
    source: debian
    override-build: |
      gzip -9nf changelog
    organize:
      (build)/changelog.gz: usr/share/doc/htop/changelog.Debian.gz
      (build)/copyright: usr/share/doc/htop/
